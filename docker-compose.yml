name: assignment-day51

services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: day51-kafka
    ports:
      - "127.0.0.1:23292:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:23292
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: l0EqHrt6QJuPhYgdyuq3zg
    volumes:
      - kafka-data-v2:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1; do sleep 3; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transactions_valid --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transactions_dlq --partitions 3 --replication-factor 1


  postgres:
    image: postgres:17-alpine
    container_name: day51-postgres
    ports:
      - "127.0.0.1:23332:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase:v0.64.3.4
    container_name: day51-metabase
    ports:
      - "127.0.0.1:23380:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_JAVA_OPTS: "-Xmx650m"
      MB_SITE_URL: "http://localhost:23380"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

  streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: day51-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:23240:4040"
    environment:
      KAFKA_SERVERS: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./streaming:/app/streaming:ro
      - ./data:/app/data
      - ./checkpoint:/app/checkpoint
      - ./jars:/opt/kafka-jars:ro
    command:
      - /bin/sh
      - -c
      - >-
        if [ -n "$$(find /opt/kafka-jars -name '*.jar' -print -quit 2>/dev/null)" ];
        then exec spark-submit --master 'local[2]' --driver-memory 1g
        --conf spark.sql.shuffle.partitions=2
        --jars "$$(find /opt/kafka-jars -name '*.jar' | paste -sd, -)"
        /app/streaming/spark_streaming_job.py;
        else exec spark-submit --master 'local[2]' --driver-memory 1g
        --conf spark.sql.shuffle.partitions=2
        --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
        /app/streaming/spark_streaming_job.py;
        fi

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: day51-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_SERVERS: kafka:19092
      EVENT_INTERVAL: "1.5"
      PYTHONUNBUFFERED: "1"

volumes:
  kafka-data-v2:
  postgres-data:
  metabase-data:
